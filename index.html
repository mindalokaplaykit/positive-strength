const STRENGTH_CONCEPTS=[{"name":"Teori Saling Ketergantungan Sosial (Deutsch; Johnson & Johnson)","explanation":"Ketika tujuan anggota kelompok saling berkaitan, keberhasilan menjadi upaya bersama. Setiap orang terdorong untuk berkontribusi sekaligus membantu rekan mencapai hasil yang sama."},{"name":"Self-Determination Theory (Deci & Ryan)","explanation":"Orang lebih siap berkembang ketika kebutuhan akan otonomi, kompetensi, dan keterhubungan terpenuhi. Pemimpin memberdayakan dengan memberi ruang memilih, dukungan belajar, dan kepercayaan."},{"name":"Personal Initiative (Frese & Fay)","explanation":"Inisiatif pribadi berarti memulai tindakan atas kemauan sendiri dan tekun mengatasi hambatan. Seseorang tidak sekadar menunggu instruksi ketika melihat ada pekerjaan yang perlu dilakukan."},{"name":"Psychological Ownership (Pierce, Kostova & Dirks)","explanation":"Rasa memiliki secara psikologis muncul ketika seseorang memandang pekerjaan sebagai sesuatu yang perlu ia jaga. Ia peduli terhadap proses dan kualitas hasil, bahkan di luar kewajiban minimum."},{"name":"Akuntabilitas dalam Pengambilan Keputusan (Tetlock)","explanation":"Kesadaran bahwa keputusan dan hasil perlu dijelaskan mendorong orang mempertimbangkan alasan serta konsekuensi tindakannya. Akuntabilitas juga berarti bersedia mengakui dan memperbaiki kesalahan."},{"name":"Behavioral Integrity (Simons)","explanation":"Integritas perilaku terlihat dari kesesuaian antara apa yang dikatakan, dijanjikan, dan dilakukan. Konsistensi tersebut membangun kepercayaan, termasuk ketika tidak ada yang mengawasi."},{"name":"Pembentukan Kebiasaan (Wood & Neal)","explanation":"Perilaku yang dilatih konsisten dalam situasi yang berulang dapat menjadi kebiasaan. Disiplin diri diperkuat dengan rutinitas dan lingkungan yang mengurangi godaan untuk menyimpang dari tujuan."},{"name":"Role Theory (Biddle)","explanation":"Setiap peran membawa harapan tentang kompetensi, tanggung jawab, dan cara memperlakukan orang lain. Profesionalisme tampak ketika seseorang menjalankan harapan itu secara cermat dan etis."},{"name":"Work Engagement (Schaufeli dkk.)","explanation":"Keterlibatan kerja mencakup semangat, dedikasi, dan keterlarutan dalam tugas. Dedikasi tampak saat seseorang merasa pekerjaannya penting lalu memberikan usaha yang sungguh-sungguh."},{"name":"Konsistensi Perilaku (Behavioral Consistency)","explanation":"Orang dinilai dapat diandalkan ketika tindakannya stabil dari waktu ke waktu. Menepati janji berulang kali membuat orang lain mampu memperkirakan dan mempercayai kontribusinya."},{"name":"Model Komunikasi Transaksional (Barnlund)","explanation":"Komunikasi merupakan proses dua arah dalam membangun pemahaman bersama. Pesan perlu disampaikan dengan jelas, kemudian diperiksa kembali melalui respons dan umpan balik."},{"name":"Perspective Taking (Davis)","explanation":"Mengambil perspektif orang lain berarti berusaha memahami pengalaman dari sudut pandangnya. Hal ini membantu kita merespons kebutuhan dan perasaannya dengan lebih tepat, bukan sekadar menebak."},{"name":"Respect for Persons (Kant)","explanation":"Setiap manusia memiliki martabat dan tidak boleh diperlakukan hanya sebagai alat mencapai tujuan. Sikap hormat diwujudkan dengan mendengarkan, menjaga batasan, dan menghargai pilihan orang lain."},{"name":"Model Kepercayaan (Mayer, Davis & Schoorman)","explanation":"Kepercayaan bertumpu pada kemampuan, niat baik, dan integritas seseorang. Seseorang menjadi layak dipercaya ketika ia kompeten, memikirkan kepentingan pihak lain, dan memegang prinsip."},{"name":"Kebutuhan untuk Memiliki (Baumeister & Leary)","explanation":"Manusia memiliki kebutuhan mendasar untuk diterima dan merasa menjadi bagian dari kelompok. Inklusivitas menciptakan kesempatan yang nyata bagi berbagai orang untuk ikut berpartisipasi."},{"name":"Keterbukaan Epistemik (Epistemic Openness)","explanation":"Pengetahuan pribadi mungkin belum lengkap, sehingga gagasan baru layak diperiksa sebelum ditolak. Keterbukaan pikiran berarti mempertimbangkan bukti dan sudut pandang lain tanpa harus menyetujui semuanya."},{"name":"Komunikasi Asertif (Assertive Communication)","explanation":"Asertivitas membantu orang menyatakan kebutuhan, batasan, dan pendapat secara jelas tanpa merendahkan orang lain. Tegas tidak sama dengan agresif; penghormatan tetap dijaga."},{"name":"Feedback Literacy (Carless & Boud)","explanation":"Literasi umpan balik adalah kemampuan memahami, menilai, dan menggunakan masukan untuk memperbaiki pekerjaan. Masukan menjadi bermanfaat ketika diolah menjadi langkah yang dapat dilakukan."},{"name":"Dialog (David Bohm)","explanation":"Dialog yang konstruktif meminta kita mendengarkan asumsi sendiri dan orang lain sebelum buru-buru menyimpulkan. Tujuannya membangun pemahaman bersama sehingga solusi bisa muncul secara lebih matang."},{"name":"Organizational Justice (Colquitt)","explanation":"Keadilan mencakup hasil yang dibagikan, proses pengambilan keputusan, dan perlakuan antarmanusia. Keputusan yang adil mempertimbangkan alasan yang transparan serta kebutuhan pihak-pihak terkait."},{"name":"Emotional Intelligence (Mayer & Salovey)","explanation":"Kecerdasan emosional mencakup kemampuan mengenali, memahami, dan menggunakan informasi emosi dengan tepat. Kedewasaan emosi terlihat ketika perasaan diakui tetapi tidak menguasai tindakan."},{"name":"Self-Awareness Theory (Duval & Wicklund)","explanation":"Saat perhatian diarahkan ke diri sendiri, kita lebih mampu membandingkan tindakan dengan nilai dan tujuan pribadi. Kesadaran diri membantu mengenali kekuatan, keterbatasan, dan dampak perilaku."},{"name":"Process Model of Emotion Regulation (James Gross)","explanation":"Respons emosi bisa dikelola sejak memilih situasi, mengarahkan perhatian, hingga menafsirkan kejadian. Mengatur diri berarti memberi ruang untuk memilih respons yang lebih berguna."},{"name":"Resilience sebagai Adaptasi Positif (Ann Masten)","explanation":"Resiliensi bukan berarti tidak mengalami kesulitan. Resiliensi tampak ketika seseorang mampu beradaptasi, pulih, dan melanjutkan langkah dengan memanfaatkan dukungan serta sumber daya."},{"name":"Intellectual Humility (Leary dkk.)","explanation":"Kerendahan hati intelektual berarti mengakui bahwa pemahaman sendiri bisa terbatas atau keliru. Sikap ini membuka kesempatan untuk belajar dari siapa pun tanpa merasa kehilangan harga diri."},{"name":"Self-Efficacy (Albert Bandura)","explanation":"Efikasi diri adalah keyakinan bahwa kita mampu melakukan tindakan yang dibutuhkan untuk menghadapi suatu tugas. Keyakinan ini tumbuh lewat pengalaman berhasil, latihan, dan dukungan yang realistis."},{"name":"Moral Courage (Keberanian Moral)","explanation":"Keberanian moral berarti bertindak sesuai prinsip yang benar meskipun ada risiko, tekanan, atau rasa takut. Keberanian tidak menghapus ketakutan, tetapi membantu kita tetap mengambil tindakan yang tepat."},{"name":"Learned Optimism (Martin Seligman)","explanation":"Optimisme yang dipelajari membantu seseorang memandang kesulitan sebagai keadaan yang dapat ditangani, bukan kegagalan permanen. Sikap ini tetap perlu dipadukan dengan penilaian risiko dan langkah nyata."},{"name":"Delay of Gratification (Walter Mischel)","explanation":"Menunda kepuasan berarti menahan dorongan memperoleh hasil segera demi tujuan jangka panjang. Kesabaran memberi ruang bagi proses, latihan, dan perkembangan yang memerlukan waktu."},{"name":"Gratitude as Moral Affect (McCullough dkk.)","explanation":"Syukur muncul ketika seseorang menyadari telah menerima kebaikan yang bernilai. Pengakuan dan penghargaan atas kebaikan itu dapat memperkuat hubungan serta mendorong tindakan baik berikutnya."},{"name":"Intrinsic Motivation (Deci & Ryan)","explanation":"Motivasi intrinsik muncul ketika aktivitas dijalankan karena menarik dan memuaskan dengan sendirinya. Kecintaan belajar membuat seseorang terus mencari pengetahuan, bukan hanya mengejar nilai atau hadiah."},{"name":"Information-Gap Theory (George Loewenstein)","explanation":"Rasa ingin tahu sering muncul ketika kita menyadari kesenjangan antara apa yang sudah diketahui dan yang ingin dipahami. Kesenjangan tersebut mendorong pertanyaan, eksplorasi, dan pencarian jawaban."},{"name":"Experiential Learning (David Kolb)","explanation":"Belajar menjadi kuat ketika pengalaman diikuti refleksi, pembentukan pemahaman, lalu percobaan kembali. Kelincahan belajar terlihat ketika pelajaran dari satu situasi diterapkan ke tantangan baru."},{"name":"Cognitive Flexibility (Fleksibilitas Kognitif)","explanation":"Fleksibilitas kognitif adalah kemampuan mengubah cara berpikir atau strategi saat informasi dan keadaan berubah. Beradaptasi bukan mengabaikan tujuan, melainkan mencari cara baru untuk mencapainya."},{"name":"Divergent Thinking (J. P. Guilford)","explanation":"Berpikir divergen menghasilkan banyak kemungkinan jawaban terhadap satu persoalan. Kreativitas berkembang ketika kita berani mengeksplorasi kombinasi baru sebelum memilih yang paling tepat."},{"name":"Design Thinking","explanation":"Design thinking menghubungkan pemahaman kebutuhan pengguna dengan penciptaan, pengujian, dan penyempurnaan solusi. Inovasi bukan sekadar ide menarik, tetapi gagasan yang diwujudkan menjadi manfaat."},{"name":"Practical Wisdom / Phronesis (Aristoteles)","explanation":"Kebijaksanaan praktis adalah kemampuan menentukan tindakan yang tepat sesuai konteks, nilai, serta konsekuensi. Pertimbangan yang bijak tidak hanya mencari jawaban cepat, tetapi juga yang patut dilakukan."},{"name":"Solution-Focused Approach (de Shazer & Berg)","explanation":"Pendekatan berfokus solusi menanyakan apa yang sudah bekerja dan langkah kecil apa yang mungkin dilakukan berikutnya. Energi dialihkan dari menyalahkan masalah menuju tindakan yang konstruktif."},{"name":"Reflective Practice (Donald Schön)","explanation":"Praktik reflektif berarti memeriksa pengalaman dan alasan di balik tindakan agar kita dapat memperbaiki langkah berikutnya. Bukan hanya bertanya apa yang terjadi, tetapi juga apa yang dipelajari."},{"name":"Kaizen (Perbaikan Berkelanjutan)","explanation":"Kaizen menekankan kemajuan melalui perubahan kecil yang dilakukan terus-menerus. Perbaikan yang konsisten dapat menghasilkan peningkatan mutu besar dari waktu ke waktu."},{"name":"Self-Concordance Model (Sheldon & Elliot)","explanation":"Tujuan yang sejalan dengan nilai dan minat pribadi cenderung memberi alasan yang lebih kuat untuk bertahan. Memiliki tujuan bermakna membantu seseorang memilih tindakan yang benar-benar penting."},{"name":"Prosocial Motivation (Adam Grant)","explanation":"Motivasi prososial muncul dari keinginan memberi manfaat bagi orang lain. Kontribusi terasa bermakna ketika usaha pribadi menghasilkan dampak yang nyata pada kebutuhan bersama."},{"name":"Flow Theory (Mihaly Csikszentmihalyi)","explanation":"Flow adalah keadaan ketika perhatian terserap dalam aktivitas yang menantang tetapi masih sesuai kemampuan. Fokus mendalam lebih mungkin muncul saat tujuan jelas dan gangguan dikurangi."},{"name":"Implicit Theories of Ability (Carol Dweck)","explanation":"Growth mindset memandang kemampuan sebagai sesuatu yang dapat dikembangkan melalui latihan, strategi, umpan balik, dan kesempatan belajar. Kesalahan menjadi informasi untuk memperbaiki cara, bukan label kemampuan tetap."},{"name":"OODA Loop (John Boyd)","explanation":"Siklus Observe–Orient–Decide–Act membantu orang mengamati informasi, memahami konteks, memutuskan, lalu bertindak. Ketegasan mengambil keputusan bukan tergesa-gesa, melainkan bergerak tepat waktu sambil siap mengevaluasi."},{"name":"Prospection (Pemikiran ke Depan)","explanation":"Prospection adalah kemampuan membayangkan kemungkinan masa depan untuk mempersiapkan tindakan hari ini. Pandangan jauh ke depan membantu kita mengantisipasi kebutuhan, risiko, dan kesempatan."},{"name":"Systems Thinking (Donella Meadows)","explanation":"Berpikir sistem berarti melihat hubungan antarkomponen, bukan hanya bagian yang terpisah. Perubahan pada satu elemen dapat memengaruhi keseluruhan sehingga keputusan perlu melihat dampak yang lebih luas."},{"name":"Bricolage (Pemanfaatan Sumber Daya yang Ada)","explanation":"Bricolage berarti menciptakan jalan keluar dengan menggabungkan sumber daya yang tersedia, bahkan ketika sarana tidak ideal. Kreativitas digunakan untuk membuat keterbatasan tetap produktif."},{"name":"Proactive Coping (Aspinwall & Taylor)","explanation":"Proactive coping dilakukan sebelum persoalan benar-benar muncul: mengenali tanda awal, menyiapkan sumber daya, dan mencegah risiko. Fokusnya mengantisipasi kebutuhan, bukan hanya bereaksi sesudah masalah terjadi."},{"name":"Stewardship Theory (Davis, Schoorman & Donaldson)","explanation":"Stewardship menekankan kesediaan menjaga amanah dan kepentingan bersama. Tanggung jawab terlihat saat seseorang merawat sumber daya, menuntaskan pekerjaan, serta memperhatikan dampak hasilnya."}];

function openVisualLibrary(){
 if(!('indexedDB' in window))return Promise.resolve(false);
 return new Promise(resolve=>{
  let request;
  try{request=indexedDB.open(ASSET_DB,1)}catch(e){resolve(false);return}
  request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains(ASSET_STORE))db.createObjectStore(ASSET_STORE,{keyPath:'key'})};
  request.onerror=()=>resolve(false);
  request.onsuccess=()=>{
   assetDB=request.result;
   let tx;
   try{tx=assetDB.transaction(ASSET_STORE,'readonly')}catch(e){resolve(false);return}
   const get=tx.objectStore(ASSET_STORE).getAll();
   get.onsuccess=()=>{for(const r of get.result||[])if(r&&/^(?:[1-9]|[1-4][0-9]|50):[0-3]$/.test(r.key)&&typeof r.data==='string'&&r.data.startsWith('data:image/webp;base64,'))customAssets[r.key]=r.data;assetStorageReady=true;resolve(true);if(page==='artwork'||page==='catalog'||page==='home')render()};
   get.onerror=()=>resolve(false);
  };
 });
}
function saveVisualAsset(id,variant,data){
 const key=assetKey(id,variant);
 if(!assetDB)return Promise.reject(new Error('Penyimpanan gambar tidak tersedia'));
 return new Promise((resolve,reject)=>{
  const tx=assetDB.transaction(ASSET_STORE,'readwrite');
  tx.oncomplete=()=>{customAssets[key]=data;resolve(true)};
  tx.onerror=()=>reject(tx.error||new Error('Gagal menyimpan gambar'));
  tx.objectStore(ASSET_STORE).put({key,id,variant,data,updatedAt:new Date().toISOString()});
 });
}
function removeVisualAsset(id,variant){
 const key=assetKey(id,variant);
 if(!assetDB)return Promise.reject(new Error('Penyimpanan gambar tidak tersedia'));
 return new Promise((resolve,reject)=>{
  const tx=assetDB.transaction(ASSET_STORE,'readwrite');
  tx.oncomplete=()=>{delete customAssets[key];resolve(true)};
  tx.onerror=()=>reject(tx.error||new Error('Gagal menghapus gambar'));
  tx.objectStore(ASSET_STORE).delete(key);
 });
}
function decodeAndOptimize(file){
 return new Promise((resolve,reject)=>{
  if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type)){reject(new Error('Gunakan JPG, PNG, atau WebP.'));return}
  if(file.size>8*1024*1024){reject(new Error('Maksimal ukuran berkas 8 MB.'));return}
  const reader=new FileReader();
  reader.onerror=()=>reject(new Error('Gagal membaca berkas gambar.'));
  reader.onload=()=>{
   const img=new Image();img.onerror=()=>reject(new Error('Gambar tidak dapat dibuka.'));
   img.onload=()=>{
    try{
     if(img.width<180||img.height<180)throw Error('Gambar terlalu kecil. Minimal 180 px setiap sisi.');
     const canvas=document.createElement('canvas');canvas.width=640;canvas.height=854;
     const ctx=canvas.getContext('2d');

   };img.src=reader.result;

async function importSingleArtwork(file){

}
function exportVisualPack(){
 const assets=Object.keys(customAssets).sort().map(key=>({key,data:customAssets[key]}));
 downloadJSON('Mindaloka-Visual-Library-'+new Date().toISOString().slice(0,10)+'.json',{format:'mindaloka-positive-strengths-artworks',version:1,createdAt:new Date().toISOString(),count:assets.length,assets});
}
async function importVisualPack(file){
 if(!assetStorageReady){toast('Penyimpanan gambar tidak tersedia.');return}
 if(!file||file.size>70*1024*1024){toast('Pilih paket gambar JSON maksimal 70 MB.');return}
 try{
  const obj=JSON.parse(await file.text());
  if(obj.format!=='mindaloka-positive-strengths-artworks'||!Array.isArray(obj.assets)||obj.assets.length>200)throw Error('Format paket tidak sesuai.');
  let count=0;
  for(const entry of obj.assets){
   if(!entry||! /^(?:[1-9]|[1-4][0-9]|50):[0-3]$/.test(entry.key)||typeof entry.data!=='string'||!/^data:image\/webp;base64,[A-Za-z0-9+/=]+$/.test(entry.data)||entry.data.length>2500000)throw Error('Paket berisi gambar atau ID yang tidak valid.');
  }
  for(const entry of obj.assets){const [id,variant]=entry.key.split(':').map(Number);await saveVisualAsset(id,variant,entry.data);count++}
  toast(`${count} aset ilustrasi berhasil diimpor.`);render(true);
 }catch(e){toast(e.message||'Impor paket ilustrasi gagal.')}
}

}

function levelConfig(level){level=clamp(+level||1,1,250);const act=Math.floor((level-1)/50)+1,spot=(level-1)%50,step=(level-1)%50;let groupSize=2,groupCount=3+step%3,time=0,mode='classic',association=false;
if(act===2){groupSize=3;groupCount=3+step%2;mode=step%4===3?'pulse':'classic'}
if(act===3){groupSize=[2,3,4,2,3][step%5];groupCount=groupSize===4?3:4+step%2;mode=step%3===0?'speed':'classic';time=mode==='speed'?130+groupCount*15:0}
if(act===4){groupSize=2+step%2;groupCount=4;association=step%3!==0;mode=step%5===0?'pulse':'classic';time=step%5===0?160:0}

case 'studio-mode':setup.mode=id;applyModeCompatibility();render(true);return;
case 'studio-group-size':setup.groupSize=val;if(setup.groupSize*setup.groups>24)setup.groups=Math.max(2,Math.floor(24/setup.groupSize));render(true);return;
case 'start-facilitator':startFacilitator();return;
case 'export':exportProgress();return;
case 'import':modal={type:'import'};dialogRender();return;
case 'import-file':importProgress();return;
case 'close-modal':modal=null;dialogRender();if(session)session.lastTick=performance.now();return;
case 'stay-home':modal=null;dialogRender();return;
case 'leave-app':allowRootExit=true;modal=null;dialogRender();history.back();return;
case 'confirm-exit':exitGame();return;
case 'flip':pickCard(val);return;
case 'begin':begin();return;
case 'pause':pause();return;
case 'resume':pause();return;
case 'exit-game':exitConfirmation();return;
case 'focus':isFocus=!isFocus;render();return;
case 'fullscreen':if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>toast('Fullscreen tidak didukung browser ini.'));return;
case 'game-help':modal={type:'hint'};dialogRender();return;
case 'risk-bank':riskBank();return;
case 'guess':modal={type:'guess'};dialogRender();return;
case 'submit-guess':submitGuess();return;
case 'again':{const copy=session.source==='arcade'?session.arcadeLevel:null;if(copy)startArcade(copy);else startFacilitator();return}
case 'next-level':startArcade(session.arcadeLevel+1);return;
case 'result-back':sessionBack();return;
}}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;handleAction(btn.dataset.action,btn.dataset.id)});
document.addEventListener('submit',e=>{if(e.target.id!=='facilitator-form')return;e.preventDefault();const pw=document.getElementById('passInput')?.value||'';if(pw==='MINDALOKA'){studioAuth=true;modal=null;authError=false;dialogRender();goto('studio')}else{authError=true;dialogRender()}});
document.addEventListener('change',e=>{const {id,value,checked}=e.target;
if(page==='artwork'&&studioAuth&&id==='artFileInput'){const f=e.target.files?.[0];if(f)importSingleArtwork(f);return}
if(page==='artwork'&&studioAuth&&id==='artPackInput'){const f=e.target.files?.[0];if(f)importVisualPack(f);return}
if(page!=='studio')return;switch(id){case 'setFocus':setup.focus=value;break;case 'setGroups':setup.groups=+value;break;case 'setTeams':setup.teams=clamp(+value,1,4);render(true);return;case 'setDuration':setup.duration=+value;break;case 'setTarget':setup.target=clamp(+value,10,1000);break;case 'setPreview':setup.preview=+value;break;case 'setAssociation':setup.association=!!checked;break}if(id==='setGroups'||id==='setDuration')render(true)});
document.addEventListener('input',e=>{if(e.target.dataset.teamName!==undefined){setup.teamNames[+e.target.dataset.teamName]=e.target.value;return}if(e.target.id==='catalogSearch'){const q=e.target.value.toLowerCase().trim();document.querySelectorAll('#catalog-grid [data-name]').forEach(el=>el.hidden=!el.dataset.name.includes(q))}
if(e.target.id==='artFind'){const q=e.target.value.toLowerCase().trim();document.querySelectorAll('#artTopicList [data-name]').forEach(el=>el.hidden=!el.dataset.name.includes(q))}});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select')||modal&&e.key!=='Escape')return;if(e.key==='Escape'&&modal){modal=null;dialogRender();return}if(e.key==='Escape'&&page==='game'){exitConfirmation();e.preventDefault();return}if(page==='game'&&e.key.toLowerCase()==='f'){handleAction('fullscreen');e.preventDefault()}else if(page==='game'&&e.key.toLowerCase()==='o'){handleAction('focus');e.preventDefault()}else if(page==='game'&&e.code==='Space'){handleAction('pause');e.preventDefault()}});
window.addEventListener('popstate',e=>{if(modal){modal=null;dialogRender()}const st=e.state;if(st?.app!=='mindaloka-positive-strengths')return;if(st.root){page='home';render();if(allowRootExit){allowRootExit=false;history.back();return}modal={type:'leave-home'};dialogRender();try{history.pushState(navState('home',false),'',location.href)}catch(err){}return}const prev=page;if(prev==='game'&&st.page!=='game')closeSessionForNavigation();if(prev==='result'&&st.page!=='result'){session=null;isFocus=false}page=st.page;render();window.scrollTo?.(0,0)});
window.addEventListener('beforeunload',()=>{if(session?.source==='arcade'&&session.phase!=='finished')persistCheckpoint()});
initNavigation();
render();
openVisualLibrary();

</script></body></html>
